name: US AI Worker (Fly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/us-ai-worker/**"
      - ".github/workflows/us-ai-worker-fly.yml"

concurrency:
  group: us-ai-worker-fly
  cancel-in-progress: true

jobs:
  deploy-fly:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/us-ai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          US_AI_WORKER_SECRET: ${{ secrets.US_AI_WORKER_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::notice::Fly deploy skipped. Add GitHub secrets: FLY_API_TOKEN, US_AI_WORKER_SECRET, OPENROUTER_API_KEY"
            exit 0
          fi
          APP="${FLY_APP_NAME:-sonogyn-us-ai}"
          flyctl apps create "$APP" 2>/dev/null || true
          if [ -n "${US_AI_WORKER_SECRET:-}" ] && [ -n "${OPENROUTER_API_KEY:-}" ]; then
            flyctl secrets set \
              US_AI_WORKER_SECRET="$US_AI_WORKER_SECRET" \
              OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
              US_VISION_MODEL="openai/gpt-4o-mini" \
              US_VISION_BACKEND="openrouter" \
              US_AI_WORKER_REFERER="https://sonogyn-pro.ru" \
              --app "$APP" --stage
          else
            echo "::warning::US_AI_WORKER_SECRET or OPENROUTER_API_KEY missing in GitHub secrets"
          fi
          flyctl deploy --app "$APP" --remote-only --ha=false
          HOST="$(flyctl status --app "$APP" 2>/dev/null | awk '/Hostname/ {print $2}')"
          echo "worker_url=https://${HOST}" >> "$GITHUB_OUTPUT"
          echo "## Fly worker" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://${HOST}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: \`curl -sS https://${HOST}/health\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vercel: set US_AI_WORKER_URL=https://${HOST}" >> "$GITHUB_STEP_SUMMARY"
