name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration drift (web SSOT vs database mirror)
        run: pnpm check:migration-drift

      - name: Generate Prisma client (web)
        run: pnpm exec prisma generate
        working-directory: apps/web

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: CPI module tests
        run: pnpm test:cpi

      - name: IOTA models tests
        run: pnpm test:iota

      - name: O-RADS US package tests
        run: pnpm test:orads-us

      - name: O-RADS decision tree snapshot (drift guard)
        run: pnpm verify:orads-tree-snapshot

      - name: Imaging CDS unit tests
        run: pnpm test:imaging-cds

      - name: BI-RADS rules snapshot (drift guard)
        run: pnpm verify:birads-rules-snapshot

      - name: Imaging CDS golden-set regression (34 synthetic cases)
        run: node --import tsx scripts/imaging-cds-eval.mjs --manifest docs/clinical-imaging-cds/golden-set/manifest.synthetic-ci.json

      - name: Security schema tests
        run: pnpm exec npm run test:security --prefix apps/web

      - name: Upload validation tests
        run: pnpm exec npm run test --prefix packages/upload-validation

      - name: Build web (webpack + PWA plugin)
        env:
          SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm exec turbo build --filter=@repo/web

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder
      E2E_FIXTURES: "true"
      NEXT_PUBLIC_E2E_FIXTURES: "true"
      DEV_SKIP_AUTH: "true"
      DEV_AUTO_LOGIN: "false"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e:cpi

      - name: Auth E2E smoke
        run: pnpm test:e2e:auth

      - name: A11y E2E smoke (soft)
        run: pnpm test:e2e:a11y

      - name: IOTA calculator E2E smoke
        run: pnpm test:e2e:iota

      - name: Evidence Assistant E2E smoke
        run: pnpm --filter @repo/web test:e2e:evidence

      - name: Security E2E smoke
        run: pnpm test:e2e:security

      - name: EMR IDOR E2E smoke (CI stub)
        run: pnpm exec playwright test tests/e2e/emr-idor-smoke.spec.ts --project=chromium-no-auth

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
